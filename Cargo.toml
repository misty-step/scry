[package]
name = "scry"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Private, prompt-first learning on Cloudflare Workers"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "=0.8.7"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
