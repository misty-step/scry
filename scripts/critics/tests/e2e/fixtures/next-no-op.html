<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Critic fixture: no-op Next</title>
</head>
<body>
  <!-- Review fixture: confirmed answer affordance; answering simulates a
       graded state; the Next control exists but does nothing (no-op).
       Expected walk outcome: finding next-no-transition (exit 1). -->
  <div class="review-stage">
    <h1>Fixture no-op test question?</h1>
    <form class="answer-form" action="#" method="post">
      <fieldset class="choice-fieldset">
        <button class="choice" name="answer" value="A" type="button">A</button>
        <button class="choice" name="answer" value="B" type="button">B</button>
      </fieldset>
    </form>
    <div id="feedback" style="display:none">
      <div role="status">Answer received</div>
      <form data-next="next" action="#" method="post">
        <button type="submit">Next</button>
      </form>
    </div>
  </div>
  <script>
    document.querySelector('.answer-form').addEventListener('click', function (e) {
      e.preventDefault();
      document.querySelector('.answer-form').style.display = 'none';
      document.getElementById('feedback').style.display = 'block';
    });
    document.querySelector('form[data-next]').addEventListener('submit', function (e) {
      e.preventDefault(); // no-op: content never changes
    });
  </script>
</body>
</html>
