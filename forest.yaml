repo: misty-step/scry

# Retained Kernel allowlist for explicitly requested Forest runs.
# It is not an intake queue and must not be expanded without operator direction.
scope:
  subjects:
    - scry-127-graded-card

agents:
  builder:  { poll: "./forest poll builder",  interval: 300 }
  verifier: { poll: "./forest poll verifier", interval: 120 }
  fixer:    { poll: "./forest poll fixer",    interval: 300 }

# Named Forest checks. Commands come from repository-owned package scripts
# except the Postgres latency export, which has no script wrapper. Names and
# order are the evidence contract; do not reorder without compatibility review.
checks:
  - name: browser-contract
    run: bun run test:browser-contract
  - name: fmt
    run: bun run rust:fmt
  - name: test
    run: bun run rust:test
  - name: clippy
    run: bun run rust:clippy
  - name: doc
    run: bun run rust:doc
  - name: perf-actions
    run: bun run perf:actions
  - name: ci-full
    run: bun run ci:full
  - name: latency-postgres-oracle
    run: mkdir -p "target/perf/action-latency-postgres-$(git rev-parse HEAD)" && dagger call action-latency-postgres --source=. --git-sha="$(git rev-parse HEAD)" export --path="target/perf/action-latency-postgres-$(git rev-parse HEAD)"
