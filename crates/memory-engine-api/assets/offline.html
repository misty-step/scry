<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f8fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f2430" media="(prefers-color-scheme: dark)">
<title>Scry — reconnect to continue</title>
<style>
 :root { color-scheme: light dark; font-family: system-ui, sans-serif; background: #f4f8fa; color: #153746; }
 body { box-sizing: border-box; margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
 main { max-width: 28rem; text-align: center; }
 h1 { font-size: clamp(2.5rem, 15vw, 5rem); letter-spacing: -.06em; margin: 0 0 .75rem; }
 p { line-height: 1.5; color: #466574; }
 button { border: 0; border-radius: 999px; background: #256581; color: #fff; font: inherit; font-weight: 700; padding: .8rem 1.2rem; cursor: pointer; }
 @media (prefers-color-scheme: dark) {
   :root { background: #0f2430; color: #e8f3f6; }
   p { color: #b3cdd8; }
   button { background: #91c5db; color: #0f2430; }
 }
</style>
</head>
<body>
<main>
<h1>Scry</h1>
<p>You’re offline. Reconnect to return to your current study space. Nothing personal is stored here.</p>
<button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
