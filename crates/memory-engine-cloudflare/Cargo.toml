[package]
name = "memory-engine-cloudflare"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Cloudflare Worker and transactional SQLite application boundary for Scry."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
memory-engine-core = { path = "../memory-engine-core" }
memory-engine-api-state = { path = "../memory-engine-api-state", default-features = false }
memory-engine-api-render = { path = "../memory-engine-api-render" }
memory-engine-generation = { path = "../memory-engine-generation" }
memory-engine-openrouter = { path = "../memory-engine-openrouter", default-features = false }
memory-engine-persistence = { path = "../memory-engine-persistence" }
memory-engine-performance = { path = "../memory-engine-performance" }
memory-engine-service = { path = "../memory-engine-service" }
memory-engine-study = { path = "../memory-engine-study" }
worker = "=0.8.5"
wasm-bindgen = "=0.2.125"
js-sys = "0.3.85"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
hmac = "0.13.0"
futures-util = "0.3.31"
serde_urlencoded = "0.7.1"
subtle = "2.6.1"
getrandom = { version = "0.3.4", features = ["wasm_js"] }

[lints]
workspace = true
