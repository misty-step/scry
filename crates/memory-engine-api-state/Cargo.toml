[package]
name = "memory-engine-api-state"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "State, auth, storage, and job adapters for the Memory Engine HTTP API."

[features]
default = ["native"]
native = [
    "dep:axum",
    "dep:memory-engine-canary",
    "dep:memory-engine-core",
    "dep:memory-engine-generation",
    "dep:memory-engine-openrouter",
    "dep:memory-engine-persistence-postgres",
    "dep:hmac",
    "dep:libc",
    "dep:rand",
    "dep:serde_json",
    "dep:sha2",
    "dep:tokio",
]

[dependencies]
axum = { version = "0.8.7", optional = true }
http = "1.4.0"
memory-engine-core = { path = "../memory-engine-core", optional = true }
memory-engine-canary = { path = "../memory-engine-canary", optional = true }
memory-engine-generation = { path = "../memory-engine-generation", optional = true }
memory-engine-openrouter = { path = "../memory-engine-openrouter", optional = true }
memory-engine-persistence = { path = "../memory-engine-persistence" }
memory-engine-performance = { path = "../memory-engine-performance" }
memory-engine-persistence-postgres = { path = "../memory-engine-persistence-postgres", optional = true }
memory-engine-service = { path = "../memory-engine-service" }
memory-engine-study = { path = "../memory-engine-study" }
hmac = { version = "0.13.0", optional = true }
libc = { version = "0.2.176", optional = true }
rand = { version = "0.9.3", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", optional = true }
sha2 = { version = "0.11.0", optional = true }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"], optional = true }

[dev-dependencies]
memory-engine-core = { path = "../memory-engine-core" }

[lints]
workspace = true
