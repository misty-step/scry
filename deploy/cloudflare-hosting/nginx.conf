# Local ingress template for the Scry container instance. The entrypoint
# substitutes __SCRY_OWNER_ID__ from the environment and writes the
# resolved config to /var/lib/scry/nginx.conf before starting nginx.
#
# This mirrors the private exe.dev position the application was designed
# for: exactly one owner identity header (set here, never accepted from a
# client), the original Host preserved so the application's own canonical
# and alias policies apply, and a loopback-only application listener that
# never sees the raw client connection. The front Worker (index.mjs)
# already enforced Cloudflare Access before a request reaches this
# container; nginx adds no second authentication layer.

worker_processes 1;
pid /var/lib/scry/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 128;
}

http {
  client_body_temp_path /var/lib/scry/nginx_tmp/body;
  proxy_temp_path /var/lib/scry/nginx_tmp/proxy;
  fastcgi_temp_path /var/lib/scry/nginx_tmp/fastcgi;
  uwsgi_temp_path /var/lib/scry/nginx_tmp/uwsgi;
  scgi_temp_path /var/lib/scry/nginx_tmp/scgi;
  access_log off;

  server {
    listen 8080;
    server_name _;

    # Same cap the Go handler enforces, plus encoding headroom.
    client_max_body_size 256k;

    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Keep the request body exactly as the client sent it.
    proxy_request_buffering off;

    # Strip every client-supplied header that could influence identity or
    # authority upstream, then set the exact owner identity value. The Host
    # passes through unchanged so the application enforces its own
    # canonical-host, alias-redirect, and mutation-rejection policies.
    proxy_set_header Host $http_host;
    proxy_set_header X-ExeDev-UserID __SCRY_OWNER_ID__;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header Forwarded "";
    proxy_set_header CF-Access-Jwt-Assertion "";
    proxy_set_header CF-Access-Authenticated-User-Email "";
    proxy_set_header X-Real-IP "";

    location / {
      proxy_pass http://127.0.0.1:8081;
    }
  }
}
