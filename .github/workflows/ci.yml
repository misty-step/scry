name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      mode:
        description: Verify an exact release PR, or promote a tested master artifact
        type: choice
        options: [verify, promote]
        default: promote
      expected_head:
        description: Required full source SHA for release-PR verification
        type: string
      artifact_id:
        description: Verified master CI Worker artifact ID (no rebuild)
        type: string
      artifact_sha256:
        description: Independently verified artifact ZIP SHA-256
        type: string

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'verify'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Include the pinned retained Go migration source.
          persist-credentials: false

      - name: Refuse a moved release-PR head
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0

      - name: Exercise the release generator with concrete commits
        env:
          RELEASE_PLEASE_MODULE: ${{ runner.temp }}/release-tool/node_modules/release-please
        run: |
          npm install --prefix "$RUNNER_TEMP/release-tool" --ignore-scripts --no-audit --no-fund release-please@17.6.0
          node --test qa/release-generator.test.cjs

      - name: Install pinned Dagger
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.21.6 BIN_DIR=$HOME/.local/bin sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # registry.dagger.io has had multi-hour 500 outages. Dagger publishes the
      # same pinned engine to GHCR; use it only when the primary pull fails.
      - name: Pull pinned Dagger engine
        run: |
          if ! docker pull -q registry.dagger.io/engine:v0.21.6; then
            docker pull -q ghcr.io/dagger/engine:v0.21.6
            echo "_EXPERIMENTAL_DAGGER_RUNNER_HOST=docker-image://ghcr.io/dagger/engine:v0.21.6" >> "$GITHUB_ENV"
          fi

      - name: Check and export exact Rust Worker candidate
        run: bun run ci:full -- --out target/ci-release --require-committed

      - name: Upload tested Worker assets, source and proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scry-worker-${{ github.sha }}
          path: target/ci-release/
          # SHA256SUMS lists hidden members (worker/.gitignore, walk marker);
          # transport all of them so the downloaded artifact verifies 64/64.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  story-walk:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'verify'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Provision browser and Scry toolchain
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          bash .exe/setup.sh
      - name: Walk Rust Worker learner stories
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/share/go-1.27.1/bin:$HOME/.local/share/node-22.22.0/bin:$HOME/.local/bin:$PATH"
          export SCRY_CRITICS_PLAYWRIGHT_PATH="$HOME/.local/share/scry-walk/node_modules/playwright"
          export SCRY_CRITICS_CHROMIUM_PATH="$HOME/.local/bin/chromium"
          npm ci --ignore-scripts --no-audit --no-fund
          qa/walk --all
      - name: Upload story-walk receipt and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scry-story-walk-${{ github.sha }}
          path: target/walk/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'promote' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    concurrency:
      group: scry-rust-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Retrieve and verify the frozen successful master artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
        run: python3 scripts/scry-promote.py prepare
      - name: Promote exact modules without rebuilding or changing routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: python3 scripts/scry-promote.py deploy
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: scry-rust-promotion-${{ github.run_id }}
          path: target/promotion.json
          if-no-files-found: warn
          retention-days: 14
      - name: Report promotion failure through the existing Actions issue path
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/scry-publish.py report-failure
