name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: [self-hosted, hetzner-ci, scry-ci]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Include the pinned retained Go migration source.
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0

      - name: Install pinned Dagger
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.21.6 BIN_DIR=$HOME/.local/bin sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # registry.dagger.io has had multi-hour 500 outages. Dagger publishes the
      # same pinned engine to GHCR; use it only when the primary pull fails.
      - name: Pull pinned Dagger engine
        run: |
          if ! docker pull -q registry.dagger.io/engine:v0.21.6; then
            docker pull -q ghcr.io/dagger/engine:v0.21.6
            echo "_EXPERIMENTAL_DAGGER_RUNNER_HOST=docker-image://ghcr.io/dagger/engine:v0.21.6" >> "$GITHUB_ENV"
          fi

      - name: Check and export exact Rust Worker candidate
        run: bun run ci:full -- --out target/ci-release --require-committed

      - name: Upload tested Worker assets, source and proof
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scry-worker-${{ github.sha }}
          path: target/ci-release/
          # SHA256SUMS lists hidden members (worker/.gitignore, walk marker);
          # transport them alongside the tested modules.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Install deploy client
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Deploy tested Worker and verify live bytes
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$GITHUB_SHA"
          python3 scripts/scry-deploy.py

      - name: Keep deployment receipt
        if: always() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scry-deployment-${{ github.sha }}
          path: target/deployment.json
          if-no-files-found: ignore
          retention-days: 14

  # Existing protected status; the actual walk already runs once inside ci:full.
  story-walk:
    needs: ci
    if: always()
    runs-on: [self-hosted, hetzner-ci, scry-ci]
    steps:
      - env:
          CI_RESULT: ${{ needs.ci.result }}
        run: test "$CI_RESULT" = success
