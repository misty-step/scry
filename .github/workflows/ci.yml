name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, phaedrus/mis-48-personal-go-rewrite]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install pinned Dagger
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.21.6 BIN_DIR=$HOME/.local/bin sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check and export exact Go release
        run: bun run ci:full -- --out target/ci-release --require-committed

      - name: Upload tested binary, source and proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scry-linux-amd64-${{ github.sha }}
          path: target/ci-release/
          if-no-files-found: error
          retention-days: 14
