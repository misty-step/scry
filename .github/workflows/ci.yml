name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      mode:
        description: Deploy a tested master artifact, or explicitly run bounded recovery maintenance
        type: choice
        options: [promote, recover]
        default: promote
      expected_head:
        description: Required full source SHA for manual deployment
        type: string
      recovery_approval:
        description: Explicit one-drill approval JSON (recover only; never source-controlled)
        type: string
      artifact_id:
        description: Verified master CI Worker artifact ID (no rebuild)
        type: string
      artifact_sha256:
        description: Independently verified artifact ZIP SHA-256
        type: string

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      artifact_sha256: ${{ steps.artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Include the pinned retained Go migration source.
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0

      - name: Install pinned Dagger
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.21.6 BIN_DIR=$HOME/.local/bin sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # registry.dagger.io has had multi-hour 500 outages. Dagger publishes the
      # same pinned engine to GHCR; use it only when the primary pull fails.
      - name: Pull pinned Dagger engine
        run: |
          if ! docker pull -q registry.dagger.io/engine:v0.21.6; then
            docker pull -q ghcr.io/dagger/engine:v0.21.6
            echo "_EXPERIMENTAL_DAGGER_RUNNER_HOST=docker-image://ghcr.io/dagger/engine:v0.21.6" >> "$GITHUB_ENV"
          fi

      - name: Check and export exact Rust Worker candidate
        run: bun run ci:full -- --out target/ci-release --require-committed

      - name: Upload tested Worker assets, source and proof
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scry-worker-${{ github.sha }}
          path: target/ci-release/
          # SHA256SUMS lists hidden members (worker/.gitignore, walk marker);
          # transport all of them so the downloaded artifact verifies 64/64.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # Preserve the protected status name without building/walking a second time.
  # ci:full already runs qa/walk --all against the exported exact Worker bytes.
  story-walk:
    needs: ci
    if: always() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Require the build containing the story walk to have passed
        env:
          CI_RESULT: ${{ needs.ci.result }}
        run: test "$CI_RESULT" = success

  promote:
    needs: ci
    if: >-
      always() && github.ref == 'refs/heads/master' &&
      ((github.event_name == 'push' && needs.ci.result == 'success') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    concurrency:
      group: scry-rust-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
      - name: Refuse a moved source or manual dispatch without exact intent
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != workflow_dispatch ]; then EXPECTED_HEAD="$GITHUB_SHA"; fi
          [[ "$EXPECTED_HEAD" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$EXPECTED_HEAD"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Retrieve and verify the frozen successful master artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ github.event_name == 'push' && needs.ci.outputs.artifact_id || inputs.artifact_id }}
          ARTIFACT_SHA256: ${{ github.event_name == 'push' && needs.ci.outputs.artifact_sha256 || inputs.artifact_sha256 }}
        run: python3 scripts/scry-promote.py prepare
      - name: Verify backup and custody, deploy exact modules, and read back live code
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
          SCRY_DEPLOY_MODE: ${{ inputs.mode || 'promote' }}
          SCRY_RECOVERY_APPROVAL: ${{ inputs.recovery_approval }}
        run: python3 scripts/scry-promote.py deploy
      - name: Verify owned cleanup and consumed approval without holding production
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # Keep the tiny consumed tombstone; never reopen admission by deleting it.
        run: python3 scripts/scry-cloud-backup.py cleanup-claim
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: scry-rust-promotion-${{ github.run_id }}
          path: |
            target/promotion.json
            target/recovery-cleanup.json
            target/recovery-claim.json
            target/recovery-schedule.json
          if-no-files-found: warn
          retention-days: 14
      - name: Report promotion failure through the existing Actions issue path
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/scry-publish.py report-failure
