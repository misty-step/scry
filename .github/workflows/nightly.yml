name: nightly

# Nightly coverage walks every live story on master, retains the receipt, and opens or updates
# one issue when it fails so a regression cannot sit unseen.
on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      failure_drill:
        description: "Fail before the walk to exercise the failure issue (fire drill)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  full-walk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Include the pinned retained Go migration source.
          persist-credentials: false
      - name: Failure-response drill
        if: ${{ inputs.failure_drill }}
        run: |
          echo "::error::Failure-response drill requested; the walk is skipped."
          exit 1
      - name: Provision browser and Scry toolchain
        run: bash .exe/setup.sh
      - name: Walk every live Rust Worker story
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/share/go-1.27.1/bin:$HOME/.local/share/node-22.22.0/bin:$HOME/.local/bin:$PATH"
          export SCRY_CRITICS_PLAYWRIGHT_PATH="$HOME/.local/share/scry-walk/node_modules/playwright"
          export SCRY_CRITICS_CHROMIUM_PATH="$HOME/.local/bin/chromium"
          npm ci --ignore-scripts --no-audit --no-fund
          qa/walk --all
      - name: Upload full-walk receipt and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scry-nightly-walk-${{ github.sha }}-${{ github.run_id }}
          path: target/walk/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Open or update the nightly failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRILL: ${{ inputs.failure_drill || false }}
        run: |
          title="Nightly story walk failed"
          body="The nightly full story walk failed on ${GITHUB_SHA}. Step logs: ${RUN_URL}. If the walk ran, the run's scry-nightly-walk artifact holds its receipt and screenshots; a failure before the walk leaves only the step logs. Refs MIS-150."
          if [ "$DRILL" = true ]; then body="Failure-response drill (not a product failure): ${body}"; fi
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
