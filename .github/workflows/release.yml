name: release

on:
  pull_request:
    branches: [master]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: scry-title-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require a publishable Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"(?:feat|fix|chore|docs|test|build|ci|refactor|style|perf|revert)(?:\([a-zA-Z0-9_. /-]+\))?!?: [^\r\n]+", os.environ["PR_TITLE"]), "Use a Conventional Commit title; the title becomes public release input"'
